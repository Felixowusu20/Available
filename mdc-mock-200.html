<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MDC Mock: 200 MCQs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F5F7; --surface:#FFFFFF; --ink:#13202A; --muted:#556572; --line:#D3DDE3;
  --accent:#0B6E8E; --accent-ink:#FFFFFF; --accent-bg:#E3F1F6;
  --ok:#157A4C; --ok-bg:#E1F3E9; --bad:#B53030; --bad-bg:#FBE6E6; --gold:#C48A00;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#141E25; --ink:#E6EDF1; --muted:#93A5B1; --line:#27363F;
    --accent:#4DB4D4; --accent-ink:#06222C; --accent-bg:#102A35;
    --ok:#52C58C; --ok-bg:#12301F; --bad:#F27C7C; --bad-bg:#371A1B; --gold:#E8B52A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E25; --ink:#E6EDF1; --muted:#93A5B1; --line:#27363F;
  --accent:#4DB4D4; --accent-ink:#06222C; --accent-bg:#102A35;
  --ok:#52C58C; --ok-bg:#12301F; --bad:#F27C7C; --bad-bg:#371A1B; --gold:#E8B52A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:16px 16px 120px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.top h1{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.modebar{margin-bottom:10px;min-height:0}
.modebtn{background:none;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:500;cursor:pointer}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

details.map{margin-bottom:16px}
details.map summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;margin-top:8px}
.grid .gap{grid-column:1/-1;height:6px}
.tick{height:12px;border:0;padding:0;border-radius:2px;background:var(--line);cursor:pointer}
.tick.ok{background:var(--ok)}
.tick.bad{background:var(--bad)}
.tick.sel{background:var(--accent)}
.tick.guess{box-shadow:inset 0 -4px 0 var(--gold)}
.tick.cur{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin:8px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--line)}
.legend .l-ok::before{background:var(--ok)}
.legend .l-bad::before{background:var(--bad)}
.legend .l-sel::before{background:var(--accent)}
.legend .l-guess::before{background:var(--gold)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.82rem;color:var(--ink)}
.chip.sec{border-color:var(--accent);color:var(--accent)}
.stem{font-family:var(--serif);font-weight:400;font-size:1.28rem;line-height:1.45;margin:0 0 18px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;min-height:54px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .12s,background-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.88rem;color:var(--muted)}
.opt .txt{flex:1;padding-top:2px}
.opt .tag{flex:none;font-size:.8rem;font-weight:600;padding-top:3px}
.opt:disabled{cursor:default;color:inherit}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.sel .tag{color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ok .tag{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.bad .tag{color:var(--bad)}
.opt.dim{opacity:.6}

.guessrow{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:.92rem}
.guessrow input{width:20px;height:20px;accent-color:var(--gold)}
.guessrow label{cursor:pointer}
.gtag{display:inline-block;margin-top:14px;font-size:.85rem;color:var(--gold);font-weight:600}

.why{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:3px 12px 12px 3px;padding:16px 18px;animation:rise .22s ease-out}
.why.bad{border-left-color:var(--bad)}
.why h3{margin:0 0 6px;font-size:1rem;font-weight:600}
.why.ok h3{color:var(--ok)}
.why.bad h3{color:var(--bad)}
.why p{margin:0;max-width:64ch}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.why{animation:none}.opt,.prog i{transition:none}}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 18px;min-height:48px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

h2.sec{font-family:var(--serif);font-size:1.2rem;margin:26px 0 10px}
.intro h2{font-family:var(--serif);font-size:1.7rem;line-height:1.2;margin:8px 0 10px}
.intro p{max-width:60ch;margin:0 0 12px}
.modes{display:grid;gap:12px;margin:20px 0}
.mode{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-family:var(--serif);font-size:1.1rem;margin-bottom:2px}
.mode span{color:var(--muted);font-size:.93rem}
.note{color:var(--muted);font-size:.9rem;max-width:62ch}

.score{font-family:var(--serif);font-size:3.2rem;line-height:1;margin:6px 0 4px}
.score small{font-size:1.2rem;color:var(--muted)}
.split{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px}
.split div{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.split b{display:block;font-family:var(--serif);font-size:1.4rem;font-weight:600}
.split span{color:var(--muted);font-size:.88rem}
.sys{display:grid;grid-template-columns:minmax(110px,170px) 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:.92rem}
.sys .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.sys .fill{height:100%;background:var(--ok)}
.sys .fill.low{background:var(--bad)}
.sys .fill.mid{background:var(--gold)}
.sys .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
details.miss{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details.miss summary{padding:12px 14px;cursor:pointer;font-weight:500;list-style:none}
details.miss summary::-webkit-details-marker{display:none}
details.miss .body{padding:0 14px 14px}
details.miss .body p{margin:6px 0}
textarea.sum{width:100%;min-height:170px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.9rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.foot{margin-top:28px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px}
@media (max-width:420px){.stem{font-size:1.18rem}.sys{grid-template-columns:100px 1fr 44px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>MDC mock: 200 MCQs</h1>
    <div class="clock" id="clock" aria-label="Elapsed time">0:00</div>
  </div>
  <div class="modebar" id="modebar"></div>
  <div class="prog" aria-hidden="true"><i id="progfill"></i></div>
  <details class="map" id="mapwrap">
    <summary>Question map</summary>
    <div class="grid" id="grid"></div>
    <p class="legend"><span class="l-ok">Correct</span><span class="l-bad">Missed</span><span class="l-sel">Answered</span><span class="l-guess">Guessed</span></p>
  </details>
  <main id="stage" aria-live="polite"></main>
</div>
<div class="bar" id="bar"></div>

<script>
/* Entry format: [topic, stem, CORRECT, wrong1, wrong2, wrong3, explanation]. Options are shuffled at load with a fixed seed. */
var PRE = [
["Anatomy","A 24-year-old footballer falls on an outstretched hand and has tenderness in the anatomical snuffbox. Which bone is at greatest risk of avascular necrosis if fractured?","Scaphoid","Lunate","Trapezium","Hamate","The scaphoid receives its blood supply retrogradely from the distal end, so a waist or proximal pole fracture can leave the proximal fragment avascular. Snuffbox tenderness with normal early X-rays still needs immobilisation and repeat imaging."],
["Anatomy","A man falls asleep with his arm hanging over a chair and wakes with wrist drop and numbness over the dorsum of the first web space. Which nerve was compressed?","Radial nerve in the spiral groove","Median nerve at the carpal tunnel","Ulnar nerve at the cubital tunnel","Axillary nerve at the quadrangular space","Radial nerve compression against the humerus (Saturday night palsy) paralyses the wrist and finger extensors, giving wrist drop. Triceps is usually spared because its branches leave higher up."],
["Anatomy","After a deep laceration of the volar wrist, a patient cannot oppose the thumb and has numbness of the palmar aspect of the lateral three and a half digits. Which nerve is injured?","Median nerve","Ulnar nerve","Radial nerve","Musculocutaneous nerve","The median nerve supplies the thenar muscles (opposition, abduction) and the palmar skin of the lateral three and a half digits. It is the nerve compressed in carpal tunnel syndrome."],
["Anatomy","A cyclist fractures the neck of the fibula and now has foot drop with numbness over the dorsum of the foot. Which nerve is injured?","Common peroneal nerve","Tibial nerve","Superior gluteal nerve","Obturator nerve","The common peroneal nerve winds around the fibular neck. Injury paralyses dorsiflexion and eversion (foot drop, steppage gait) and numbs the dorsum of the foot."],
["Anatomy","After hip surgery a patient's pelvis drops on the opposite side when standing on the operated leg (positive Trendelenburg sign). Which nerve is injured?","Superior gluteal nerve","Inferior gluteal nerve","Obturator nerve","Femoral nerve","The superior gluteal nerve supplies gluteus medius and minimus, the hip abductors that stabilise the pelvis in single-leg stance. The inferior gluteal nerve supplies gluteus maximus."],
["Anatomy","Intramuscular injections are given in the upper outer quadrant of the buttock mainly to avoid which structure?","Sciatic nerve","Femoral nerve","Pudendal nerve","Obturator nerve","The sciatic nerve passes through the lower medial part of the gluteal region, so the upper outer quadrant is the safe site. Injury causes foot drop and sensory loss below the knee."],
["Anatomy","A singer cannot reach high-pitched notes after a thyroidectomy in which the superior thyroid artery was ligated close to the gland. Which nerve was injured?","External branch of the superior laryngeal nerve","Recurrent laryngeal nerve","Internal branch of the superior laryngeal nerve","Hypoglossal nerve","The external laryngeal nerve supplies cricothyroid, which tenses the vocal cords for pitch, and it runs close to the superior thyroid artery. Recurrent laryngeal injury gives hoarseness instead."],
["Anatomy","A boy is hit on the side of the head, is briefly unconscious, recovers, then deteriorates hours later. CT shows a biconvex lesion. Which vessel is most likely torn?","Middle meningeal artery","Bridging cortical vein","Anterior cerebral artery","Basilar artery","A fracture at the pterion tears the middle meningeal artery, causing an epidural haematoma with a lucid interval. Subdural bleeds come from bridging veins and look crescentic."],
["Anatomy","A stroke patient has contralateral weakness and sensory loss affecting the leg more than the arm. Which artery is occluded?","Anterior cerebral artery","Middle cerebral artery","Posterior cerebral artery","Basilar artery","The ACA supplies the medial frontal and parietal lobes, where the leg is represented in the motor and sensory homunculus."],
["Anatomy","A right-handed man has right face and arm weakness greater than leg weakness, with non-fluent speech. Which vessel is involved?","Left middle cerebral artery","Left anterior cerebral artery","Left posterior cerebral artery","Right middle cerebral artery","The left MCA supplies the lateral hemisphere, including the face and arm motor areas and Broca area, giving contralateral weakness and expressive aphasia."],
["Anatomy","A patient has sudden vertigo, hoarseness, ipsilateral facial pain and temperature loss, and contralateral loss of pain and temperature in the body. Which artery is occluded?","Posterior inferior cerebellar artery","Anterior inferior cerebellar artery","Anterior spinal artery","Superior cerebellar artery","This is lateral medullary (Wallenberg) syndrome, usually from PICA or vertebral artery occlusion."],
["Anatomy","A stab wound causes a right-sided hemisection of the spinal cord at T10. Which finding is expected?","Loss of pain and temperature on the left below the lesion","Loss of pain and temperature on the right below the lesion","Loss of proprioception on the left below the lesion","Spastic weakness of the left leg","Spinothalamic fibres cross within a segment or two of entering the cord, so pain and temperature are lost on the opposite side. Dorsal column loss and corticospinal weakness are on the same side as the lesion."],
["Anatomy","A patient with a chronic posterior duodenal ulcer presents with massive haematemesis. Which artery has most likely been eroded?","Gastroduodenal artery","Left gastric artery","Splenic artery","Superior mesenteric artery","The gastroduodenal artery runs behind the first part of the duodenum, so posterior ulcers can erode it and cause torrential bleeding."],
["Anatomy","A hernia that enters the inguinal canal through the deep inguinal ring, lateral to the inferior epigastric vessels, is:","Indirect inguinal hernia","Direct inguinal hernia","Femoral hernia","Obturator hernia","Indirect hernias pass through the deep ring lateral to the inferior epigastric vessels and may reach the scrotum. Direct hernias bulge through Hesselbach triangle, medial to the vessels."],
["Anatomy","A strangulated femoral hernia is hard to reduce because the femoral ring is bounded medially by which structure?","Lacunar ligament","Inguinal ligament","Pectineal ligament","Femoral vein","The sharp edge of the lacunar (Gimbernat) ligament forms the medial border of the femoral ring, which makes strangulation common. The femoral vein is lateral."],
["Anatomy","A patient with a subphrenic abscess has pain at the tip of the right shoulder. This referred pain travels via which nerve roots?","C3, C4, C5 (phrenic nerve)","C5, C6, C7","T1, T2","C7, C8","The central diaphragm is supplied by the phrenic nerve (C3-5), and the skin of the shoulder tip by C3-4, so irritation is felt at the shoulder tip."],
["Anatomy","After axillary node dissection for breast cancer, the medial border of the scapula protrudes when the patient pushes against a wall. Which nerve is injured?","Long thoracic nerve","Thoracodorsal nerve","Spinal accessory nerve","Dorsal scapular nerve","The long thoracic nerve supplies serratus anterior, which holds the scapula against the chest wall. Injury causes a winged scapula."],
["Anatomy","Which rotator cuff muscle is most commonly torn and initiates the first 15 degrees of abduction?","Supraspinatus","Infraspinatus","Teres minor","Subscapularis","Supraspinatus passes under the acromion and is the most commonly injured rotator cuff tendon (impingement). It initiates abduction before deltoid takes over."],
["Anatomy","A neonate delivered with shoulder dystocia holds the arm adducted, internally rotated and pronated (waiter's tip). Which roots are injured?","C5 and C6","C7 and C8","C8 and T1","T1 only","Upper trunk (C5-6) injury paralyses deltoid, biceps and the external rotators, giving the Erb palsy posture. C8-T1 injury causes claw hand (Klumpke)."],
["Anatomy","A patient with a pituitary macroadenoma has loss of the outer visual field in both eyes. Where is the compression?","Optic chiasm","Right optic tract","Optic radiation in the temporal lobe","Occipital cortex","The chiasm carries the crossing nasal retinal fibres, which see the temporal fields. Compression from below by a pituitary tumour gives bitemporal hemianopia."],
["Anatomy","On protrusion, the tongue deviates to the left. The lesion is:","Left hypoglossal nerve (lower motor neuron)","Right hypoglossal nerve","Left glossopharyngeal nerve","Left vagus nerve","In a unilateral hypoglossal lesion the intact genioglossus pushes the tongue toward the weak side, so it deviates toward the side of the lesion."],
["Anatomy","A stroke patient has weakness of the lower face on the right but can wrinkle the forehead on both sides. Why?","The upper face has bilateral cortical innervation","The facial nerve nucleus was spared","The chorda tympani is intact","Trigeminal motor fibres compensate","Upper motor neuron lesions spare the forehead because the part of the facial nucleus supplying the upper face receives corticobulbar fibres from both hemispheres. Bell palsy (lower motor neuron) paralyses the whole half of the face."],
["Embryology","A newborn with Down syndrome has bilious vomiting on day 1 and a double bubble sign on X-ray. The embryological failure is:","Failure of recanalisation of the duodenum","Failure of midgut rotation","Persistence of the vitelline duct","Failure of neural crest cell migration","Duodenal atresia results from failure of the solid stage of the duodenum to recanalise, and is associated with Down syndrome."],
["Embryology","A neonate fails to pass meconium in 48 hours and has a distended abdomen. Rectal biopsy shows absent ganglion cells. The defect is failure of migration of:","Neural crest cells","Endodermal cells","Intermediate mesoderm","Notochordal cells","Hirschsprung disease results from failure of neural crest cells to colonise the distal bowel, leaving an aganglionic segment."],
["Embryology","A 3-year-old has painless rectal bleeding. A technetium scan shows ectopic gastric mucosa in the ileum. This lesion is a remnant of the:","Vitelline duct","Urachus","Allantois","Cloacal membrane","Meckel diverticulum is a persistent vitelline duct remnant (rule of 2s). Ectopic gastric mucosa secretes acid, causing ulceration and bleeding."],
["Embryology","A newborn drools, chokes on the first feed and has gas in the stomach on X-ray. The most common anomaly is:","Oesophageal atresia with a distal tracheo-oesophageal fistula","Isolated oesophageal atresia without fistula","H-type fistula without atresia","Proximal fistula with distal atresia","About 85% of cases have a proximal blind oesophageal pouch and a distal fistula to the trachea, which explains the gas in the stomach."],
["Histology","Endoscopic biopsy in a long-standing reflux patient shows distal oesophageal squamous epithelium replaced by columnar epithelium with goblet cells. This is:","Barrett oesophagus (intestinal metaplasia)","Squamous dysplasia","Eosinophilic oesophagitis","Achalasia","Chronic acid exposure causes metaplasia to intestinal-type epithelium, which predisposes to oesophageal adenocarcinoma."],
["Embryology","A newborn has a continuous machinery murmur. The patent vessel is derived from which embryonic structure?","Left sixth aortic arch","Right fourth aortic arch","Left fourth aortic arch","Third aortic arch","The ductus arteriosus is derived from the distal left sixth aortic arch. It closes functionally in the first days after birth and may stay patent in prematurity or after maternal rubella."],
["Physiology","A child with nephrotic syndrome develops generalised oedema mainly because of reduced:","Plasma oncotic pressure","Capillary hydrostatic pressure","Lymphatic drainage","Interstitial oncotic pressure","Heavy albuminuria lowers plasma albumin and oncotic pressure, so Starling forces push fluid into the interstitium."],
["Physiology","A patient has a heart rate of 80 beats/min and a stroke volume of 70 mL. What is the cardiac output?","5.6 L/min","3.5 L/min","7.0 L/min","1.1 L/min","Cardiac output = HR × SV = 80 × 70 mL = 5600 mL/min, or 5.6 L/min."],
["Physiology","A patient with severe COPD and chronic CO₂ retention is given high-flow oxygen and becomes drowsy. Which mechanism contributes most?","Loss of hypoxic drive with worsened V/Q mismatch","Direct oxygen toxicity of the respiratory centre","Increased central chemoreceptor sensitivity","Bronchospasm caused by oxygen","In chronic hypercapnia, central chemoreceptors adapt and drive depends partly on hypoxia. Excess oxygen reduces that drive and worsens V/Q matching, so the target saturation is 88-92%."],
["Physiology","Pulmonary embolism produces which ventilation-perfusion pattern in the affected lung zone?","High V/Q (dead space)","Low V/Q (shunt)","Normal V/Q","Zero ventilation","The occluded zone is ventilated but not perfused, so V/Q rises towards infinity (alveolar dead space)."],
["Physiology","A patient with a large right-to-left shunt is given 100% oxygen but PaO₂ barely rises. Why?","Shunted blood bypasses ventilated alveoli","Haemoglobin is already fully saturated","Diffusion across the membrane is impaired","Alveolar ventilation is too high","Blood passing through the shunt never contacts alveolar gas, so raising inspired oxygen has little effect on the mixed arterial value."],
["Physiology","A child with severe watery diarrhoea has pH 7.25, HCO₃⁻ 12 mmol/L and a normal anion gap. The most likely cause of the acidosis is:","Faecal bicarbonate loss","Lactic acid accumulation","Ketone production","Renal failure","Diarrhoea loses bicarbonate, giving a hyperchloraemic (normal anion gap) metabolic acidosis."],
["Physiology","Persistent vomiting in an infant with pyloric stenosis causes which metabolic picture?","Hypochloraemic, hypokalaemic metabolic alkalosis","Hyperchloraemic metabolic acidosis","Respiratory acidosis","High anion gap metabolic acidosis","Loss of gastric HCl and volume depletion with aldosterone excess give a metabolic alkalosis with low chloride and low potassium."],
["Physiology","A hypertensive patient has a renal artery stenosis. The hypertension results mainly from increased:","Renin release and angiotensin II","Antidiuretic hormone","Atrial natriuretic peptide","Parathyroid hormone","Reduced renal perfusion pressure activates the juxtaglomerular cells, raising renin, angiotensin II and aldosterone."],
["Physiology","An anxious young woman hyperventilates and develops perioral tingling and carpopedal spasm. The mechanism is:","Reduced ionised calcium due to alkalosis","Reduced total body calcium","Hyperkalaemia","Hypermagnesaemia","Respiratory alkalosis increases albumin binding of calcium, lowering the free ionised fraction and causing neuromuscular irritability."],
["Physiology","Which substance's clearance best measures the glomerular filtration rate?","Inulin","Para-aminohippuric acid","Glucose","Urea","Inulin is freely filtered and neither secreted nor reabsorbed. PAH clearance estimates renal plasma flow, and creatinine clearance is the clinical approximation of GFR."],
["Physiology","In a water deprivation test, a patient's urine remains dilute but concentrates after desmopressin. The diagnosis is:","Central diabetes insipidus","Nephrogenic diabetes insipidus","Primary polydipsia","SIADH","A response to desmopressin shows the kidney can respond to ADH, so the defect is a lack of ADH secretion (central DI). In nephrogenic DI the kidney does not respond."],
["Physiology","What happens to the resting membrane potential of cardiac myocytes in hyperkalaemia?","It becomes less negative","It becomes more negative","It is unchanged","It reverses polarity","Raised extracellular K⁺ reduces the K⁺ gradient and depolarises the cells. Persistent depolarisation inactivates sodium channels, causing conduction block and arrest."],
["Physiology","A patient with severe anaemia (Hb 5 g/dL) has a normal PaO₂ of 13 kPa. Which value is reduced?","Arterial oxygen content","Arterial oxygen tension","Alveolar PO₂","Oxygen saturation of the haemoglobin present","PaO₂ reflects dissolved oxygen only. Oxygen content and delivery depend on haemoglobin concentration and are reduced in anaemia, while saturation of the haemoglobin that is present stays normal."],
["Physiology","In myasthenia gravis, weakness worsens with repeated use because antibodies block:","Nicotinic acetylcholine receptors at the neuromuscular junction","Presynaptic voltage-gated calcium channels","Acetylcholine synthesis","Muscarinic receptors","Autoantibodies against postsynaptic nicotinic ACh receptors reduce end-plate potentials. Lambert-Eaton syndrome targets presynaptic calcium channels."],
["Physiology","Several years after total gastrectomy, a patient develops macrocytic anaemia. Which gastric product is missing?","Intrinsic factor from parietal cells","Pepsinogen from chief cells","Gastrin from G cells","Bicarbonate from mucous cells","Intrinsic factor is needed for vitamin B12 absorption in the terminal ileum. Loss leads to B12 deficiency once body stores are used up."],

/* ---------- build the exam (deterministic) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function make(arr,grp,seed){
  return arr.map(function(x,n){
    var r=rng(seed+n*7919);
    var opts=[{t:x[2],c:true},{t:x[3]},{t:x[4]},{t:x[5]}];
    shuffle(opts,r);
    var a=0; for(var k=0;k<4;k++){ if(opts[k].c) a=k; }
    return {g:grp,s:x[0],q:x[1],o:opts.map(function(p){return p.t;}),a:a,e:x[6]};
  });
}
var P = shuffle(make(PRE,"Preclinical",1000),rng(11));
var C = shuffle(make(CLI,"Clinical",5000),rng(23));
var Q = [];
for(var b=0;b<4;b++){
  var blk = P.slice(b*25,b*25+25).concat(C.slice(b*25,b*25+25));
  shuffle(blk,rng(100+b));
  Q = Q.concat(blk);
}

var N = Q.length, SET = 50, KEY = "mdc-mock200-v1";
var state = {i:0, ans:[], elapsed:0, done:false, mode:null, review:false};
for(var z=0; z<N; z++) state.ans.push(null);
var view = "q";
var pendingGuess = false, confirmReset = false;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s && s.ans && s.ans.length===N){ state = s; }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var L = ["A","B","C","D"];
var stage = document.getElementById("stage");
var bar = document.getElementById("bar");
var grid = document.getElementById("grid");
var clock = document.getElementById("clock");
var progfill = document.getElementById("progfill");
var mapwrap = document.getElementById("mapwrap");

function fmt(t){ var h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60; return (h?h+":"+(m<10?"0":""):"")+m+":"+(s<10?"0":"")+s; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function answered(){ var n=0; for(var j=0;j<N;j++) if(state.ans[j]) n++; return n; }
function showFeedback(j){ return state.mode==="learn" || state.review || state.done; }

setInterval(function(){
  if(state.done || !state.mode) return;
  state.elapsed++;
  clock.textContent = fmt(state.elapsed);
  if(state.elapsed % 15 === 0) save();
},1000);

function buildGrid(){
  var h="";
  for(var j=0;j<N;j++){
    if(j>0 && j%SET===0) h += '<span class="gap"></span>';
    h += '<button class="tick" data-go="'+j+'" aria-label="Question '+(j+1)+'" title="Question '+(j+1)+'"></button>';
  }
  grid.innerHTML = h;
}
function paint(){
  var mb = document.getElementById("modebar");
  mb.innerHTML = (state.mode==="exam" && view==="q" && !state.review && !state.done) ? '<button class="modebtn" data-act="tolearn">Switch to learn mode</button>' : '';
  var ts = grid.querySelectorAll(".tick");
  for(var j=0;j<ts.length;j++){
    var a=state.ans[j], c="tick";
    if(a){
      if(showFeedback(j)){ c += (a.sel===Q[j].a ? " ok" : " bad"); }
      else c += " sel";
      if(a.guess) c += " guess";
    }
    if(view==="q" && state.mode && j===state.i) c += " cur";
    ts[j].className = c;
  }
  progfill.style.width = (answered()/N*100)+"%";
}

/* ---------- intro ---------- */
function renderIntro(){
  bar.innerHTML = "";
  stage.innerHTML =
   '<div class="intro"><h2>Full MDC mock: 200 MCQs</h2>'+
   '<p>Four sets of 50. Each set has 25 preclinical and 25 clinical questions, shuffled together. Preclinical questions are written as clinical scenarios, the way the exam rewards you for knowing the science.</p>'+
   '<p>Your progress saves in this browser. You can close the page and resume where you stopped.</p>'+
   '<div class="modes">'+
   '<button class="mode" data-mode="learn"><b>Learn mode</b><span>Explanation after every answer. Best for building knowledge from your misses.</span></button>'+
   '<button class="mode" data-mode="exam"><b>Exam mode</b><span>No feedback until the end. You can change answers and jump between questions. Pace yourself at about one minute per question.</span></button>'+
   '</div><p class="note">Tick "I am guessing" on any question you are unsure about. Guesses that land are not secure knowledge, and the results page shows them separately.</p></div>';
  paint();
}

/* ---------- question ---------- */
function renderQuestion(){
  view = "q";
  var q = Q[state.i], a = state.ans[state.i];
  var fb = showFeedback(state.i);
  var setNo = Math.floor(state.i/SET)+1;
  var h = '<div class="meta"><span>Question '+(state.i+1)+' of '+N+'</span><span class="chip">Set '+setNo+'</span><span class="chip sec">'+q.g+'</span>'+(fb||state.mode==="learn"?'<span class="chip">'+esc(q.s)+'</span>':'')+'</div>';
  h += '<h2 class="stem">'+esc(q.q)+'</h2><div class="opts" role="group" aria-label="Answer options">';
  var lock = (state.mode==="learn" && a) || state.review || state.done;
  for(var k=0;k<4;k++){
    var cls = "opt", tag = "";
    if(a){
      if(fb){
        if(k===q.a){ cls += " ok"; tag = a.sel===k ? "Your answer, correct" : "Correct answer"; }
        else if(k===a.sel){ cls += " bad"; tag = "Your answer"; }
        else cls += " dim";
      } else if(k===a.sel){ cls += " sel"; tag = "Selected"; }
    }
    h += '<button class="'+cls+'" data-pick="'+k+'"'+(lock?' disabled':'')+'><span class="ltr">'+L[k]+'</span><span class="txt">'+esc(q.o[k])+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</button>';
  }
  h += '</div>';
  if(!a || (state.mode==="exam" && !state.review && !state.done)){
    var checked = a ? a.guess : pendingGuess;
    h += '<div class="guessrow"><input type="checkbox" id="g"'+(checked?' checked':'')+'><label for="g">I am guessing on this one</label></div>';
  } else if(a.guess){
    h += '<div class="gtag">Marked as a guess</div>';
  }
  if(a && fb){
    var right = a.sel===q.a;
    h += '<section class="why '+(right?'ok':'bad')+'" id="why"><h3>'+(right?'Correct.':'Not quite. The answer is '+L[q.a]+'.')+'</h3><p>'+esc(q.e)+'</p></section>';
  }
  stage.innerHTML = h;
  var last = state.i===N-1;
  var canNext = state.mode==="exam" && !state.review && !state.done ? true : !!a;
  var label = last ? (state.mode==="exam" && !state.review ? "Finish exam" : "See results") : "Next question";
  bar.innerHTML = '<div class="in"><button class="btn ghost" data-act="prev"'+(state.i===0?' disabled':'')+'>Back</button><button class="btn primary" data-act="next"'+(canNext?'':' disabled')+'>'+label+'</button></div>';
  paint();
}

function pick(k){
  if(!state.mode || view!=="q") return;
  var a = state.ans[state.i];
  if(state.review || state.done) return;
  if(state.mode==="learn" && a) return;
  var g = document.getElementById("g");
  state.ans[state.i] = {sel:k, guess: g ? g.checked : false};
  pendingGuess = false;
  save();
  renderQuestion();
  if(state.mode==="learn"){
    var w = document.getElementById("why");
    if(w){ try{ w.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){} }
  }
}
function toggleGuess(v){
  var a = state.ans[state.i];
  if(a && state.mode==="exam" && !state.review && !state.done){ a.guess = v; save(); paint(); }
  else if(!a){ pendingGuess = v; }
}
function next(){
  if(view==="break"){ renderQuestion(); window.scrollTo(0,0); return; }
  var a = state.ans[state.i];
  if(state.mode==="learn" && !state.review && !a) return;
  pendingGuess = false;
  if(state.i===N-1){ state.done = true; state.review=false; save(); renderResults(); return; }
  if((state.i+1)%SET===0 && !state.review){
    state.i++; save(); renderBreak(Math.floor((state.i)/SET)); return;
  }
  state.i++; save(); renderQuestion(); window.scrollTo(0,0);
}
function prev(){
  if(view==="break"){ state.i--; renderQuestion(); window.scrollTo(0,0); return; }
  if(state.i>0){ state.i--; pendingGuess=false; renderQuestion(); window.scrollTo(0,0); }
}
function firstOpen(){ for(var j=0;j<N;j++){ if(!state.ans[j]) return j; } return N-1; }
function go(j){
  if(!state.mode) return;
  var free = state.mode==="exam" || state.review || state.done;
  if(!free && j>firstOpen()) return;
  if(state.done){ state.done=false; state.review=true; }
  state.i = j; pendingGuess=false; renderQuestion(); window.scrollTo(0,0);
}

/* ---------- set break ---------- */
function renderBreak(setDone){
  view = "break";
  var from=(setDone-1)*SET, to=setDone*SET, ok=0, n=0;
  for(var j=from;j<to;j++){ var a=state.ans[j]; if(a){ n++; if(a.sel===Q[j].a) ok++; } }
  var h = '<div class="intro"><h2>Set '+setDone+' complete</h2>';
  if(state.mode==="learn") h += '<p>You scored <b>'+ok+' of '+SET+'</b> in this set.</p>';
  else h += '<p>You answered <b>'+n+' of '+SET+'</b> questions in this set. Scores appear at the end in exam mode.</p>';
  h += '<p class="note">Stand up, drink water, rest your eyes for five minutes. Your progress is saved.</p></div>';
  stage.innerHTML = h;
  bar.innerHTML = '<div class="in"><button class="btn ghost" data-act="prev">Back</button><button class="btn primary" data-act="next">Start set '+(setDone+1)+'</button></div>';
  paint(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function stats(){
  var r={ok:0,pre:0,cli:0,preN:0,cliN:0,guessed:0,guessedOk:0,unans:0,missed:[],bySys:{},order:[],sets:[0,0,0,0]};
  for(var j=0;j<N;j++){
    var q=Q[j], a=state.ans[j];
    if(!r.bySys[q.s]){ r.bySys[q.s]={r:0,t:0}; r.order.push(q.s); }
    r.bySys[q.s].t++;
    if(q.g==="Preclinical") r.preN++; else r.cliN++;
    var right = a && a.sel===q.a;
    if(!a) r.unans++;
    if(right){ r.ok++; r.bySys[q.s].r++; r.sets[Math.floor(j/SET)]++; if(q.g==="Preclinical") r.pre++; else r.cli++; }
    else r.missed.push(j);
    if(a && a.guess){ r.guessed++; if(right) r.guessedOk++; }
  }
  return r;
}
function summaryText(st){
  var t = "MDC mock 200 ("+(state.mode==="exam"?"exam":"learn")+" mode)\n";
  t += "Score: "+st.ok+"/"+N+" ("+Math.round(st.ok/N*100)+"%)\n";
  t += "Preclinical: "+st.pre+"/"+st.preN+" | Clinical: "+st.cli+"/"+st.cliN+"\n";
  t += "Sets: "+st.sets.map(function(x,i){return (i+1)+": "+x+"/50";}).join(" | ")+"\n";
  t += "Guessed: "+st.guessed+" (guessed and right: "+st.guessedOk+")"+(st.unans?" | Unanswered: "+st.unans:"")+"\n";
  t += "Time: "+fmt(state.elapsed)+"\n";
  var weak = st.order.filter(function(s){return st.bySys[s].r<st.bySys[s].t;}).sort(function(x,y){
    return (st.bySys[x].r/st.bySys[x].t)-(st.bySys[y].r/st.bySys[y].t);
  }).map(function(s){return s+" "+st.bySys[s].r+"/"+st.bySys[s].t;});
  t += "Topics (correct/total), weakest first: "+(weak.length?weak.join(", "):"none missed");
  return t;
}
function renderResults(){
  view = "results";
  var st = stats();
  var pct = Math.round(st.ok/N*100);
  var h = '<h2 class="sec" style="margin-top:4px">Result</h2>';
  h += '<div class="score">'+st.ok+'<small> / '+N+'</small></div><div class="note">'+pct+'% in '+fmt(state.elapsed)+(st.unans?' ('+st.unans+' unanswered)':'')+'</div>';
  h += '<div class="split"><div><b>'+st.pre+' / '+st.preN+'</b><span>Preclinical</span></div><div><b>'+st.cli+' / '+st.cliN+'</b><span>Clinical</span></div><div><b>'+st.guessedOk+' / '+st.guessed+'</b><span>Guesses that landed</span></div></div>';
  h += '<div class="split">'+st.sets.map(function(x,i){return '<div><b>'+x+' / 50</b><span>Set '+(i+1)+'</span></div>';}).join("")+'</div>';
  h += '<h2 class="sec">By topic, weakest first</h2>';
  var list = st.order.slice().sort(function(x,y){
    var px=st.bySys[x].r/st.bySys[x].t, py=st.bySys[y].r/st.bySys[y].t;
    return px-py || st.bySys[y].t-st.bySys[x].t;
  });
  list.forEach(function(s){
    var d=st.bySys[s], p=d.r/d.t, c = p<0.5?"low":(p<0.8?"mid":"");
    h += '<div class="sys"><span>'+esc(s)+'</span><div class="track"><div class="fill '+c+'" style="width:'+Math.max(4,Math.round(p*100))+'%"></div></div><span class="n">'+d.r+'/'+d.t+'</span></div>';
  });
  h += '<h2 class="sec">Questions to revisit ('+st.missed.length+')</h2>';
  if(!st.missed.length) h += '<p class="note">No misses. Check the guesses that landed: those are not secure yet.</p>';
  st.missed.forEach(function(j){
    var q=Q[j], a=state.ans[j];
    h += '<details class="miss"><summary>Q'+(j+1)+', '+esc(q.s)+': '+esc(q.q)+'</summary><div class="body"><p><b>Your answer:</b> '+(a?L[a.sel]+'. '+esc(q.o[a.sel]):'Not answered')+'</p><p><b>Correct:</b> '+L[q.a]+'. '+esc(q.o[q.a])+'</p><p>'+esc(q.e)+'</p></div></details>';
  });
  h += '<h2 class="sec">Send this back to plan your repair days</h2><p class="note">Copy this summary and paste it in the chat. I will target your weakest topics next.</p>';
  h += '<textarea class="sum" id="sum" readonly></textarea><div class="row"><button class="btn primary" style="flex:none" data-act="copy">Copy summary</button><span class="note" id="copied" style="align-self:center"></span></div>';
  h += '<div class="foot"><button data-act="review">Review all questions with explanations</button><button data-act="reset" id="rs">Start over</button></div>';
  stage.innerHTML = h;
  document.getElementById("sum").value = summaryText(st);
  bar.innerHTML = "";
  paint(); window.scrollTo(0,0);
}
function copySummary(){
  var ta = document.getElementById("sum"), msg = document.getElementById("copied");
  ta.focus(); ta.select();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent="Copied."; }, function(){ msg.textContent="Select the text above and copy it."; });
      return;
    }
  }catch(e){}
  var ok=false; try{ ok = document.execCommand("copy"); }catch(e){}
  msg.textContent = ok ? "Copied." : "Select the text above and copy it.";
}
function reset(){
  var b = document.getElementById("rs");
  if(!confirmReset){ confirmReset=true; b.textContent="Press again to erase all answers"; return; }
  confirmReset=false;
  state = {i:0, ans:[], elapsed:0, done:false, mode:null, review:false};
  for(var z=0; z<N; z++) state.ans.push(null);
  save(); clock.textContent="0:00"; view="q"; renderIntro(); window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t = e.target.closest("[data-pick],[data-act],[data-go],[data-mode]");
  if(!t) return;
  if(t.hasAttribute("data-mode")){ state.mode = t.getAttribute("data-mode"); state.i=0; save(); renderQuestion(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-pick")) pick(parseInt(t.getAttribute("data-pick"),10));
  else if(t.hasAttribute("data-go")) go(parseInt(t.getAttribute("data-go"),10));
  else {
    var act = t.getAttribute("data-act");
    if(act==="next") next();
    else if(act==="prev") prev();
    else if(act==="tolearn"){ state.mode="learn"; save(); renderQuestion(); window.scrollTo(0,0); }
    else if(act==="copy") copySummary();
    else if(act==="reset") reset();
    else if(act==="review"){ state.done=false; state.review=true; state.i=0; save(); renderQuestion(); window.scrollTo(0,0); }
  }
});
document.addEventListener("change",function(e){
  if(e.target && e.target.id==="g") toggleGuess(e.target.checked);
});
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var tag = (e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input") return;
  if(!state.mode || view!=="q") return;
  var key = e.key.toLowerCase(), idx = -1;
  if(key.length===1 && "abcd".indexOf(key)>-1) idx = "abcd".indexOf(key);
  else if(key.length===1 && "1234".indexOf(key)>-1) idx = "1234".indexOf(key);
  if(idx>-1){ pick(idx); return; }
  if((key==="enter"||key==="arrowright") && tag!=="button"){
    var ok = (state.mode==="exam" && !state.review) || state.ans[state.i] || state.review;
    if(ok){ e.preventDefault(); next(); }
  } else if(key==="arrowleft"){ prev(); }
});

/* ---------- start ---------- */
load();
buildGrid();
clock.textContent = fmt(state.elapsed);
if(!state.mode) renderIntro();
else if(state.done) renderResults();
else renderQuestion();
</script>
</body>
</html>
